# Runs on every push and pull request. No API key is used and no model is called.
name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - name: Harness tests (no network)
        run: python -m pytest -q
      - name: Every task behaves as labeled
        run: claimcheck check-tasks
      - name: Known cheats fail on every unsolvable task
        run: claimcheck probe

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Docker sandbox blocks network, file, memory, and process attacks
        run: claimcheck sandbox-test
